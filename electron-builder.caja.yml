appId: com.darasistema.cajapunto1
productName: Cajapunto1
publish:
  provider: github
  owner: ranghd
  repo: darasistema
  channel: caja
  releaseType: release
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
  - node_modules/sql.js/dist/sql-wasm.wasm
  - node_modules/sql.js/dist/sql-wasm.js
  - node_modules/sql.js/package.json
win:
  target: nsis
  icon: build/icon-caja.png
nsis:
  # Nombre fijo (sin version): asi el enlace .../releases/latest/download/Cajapunto1-Setup.exe
  # siempre baja la ultima version.
  artifactName: Cajapunto1-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
