appId: com.darasistema.app
productName: Darasistema
publish:
  provider: github
  owner: ranghd
  repo: darasistema
  releaseType: release
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
  - node_modules/sql.js/dist/sql-wasm.wasm
  - node_modules/sql.js/dist/sql-wasm.js
  - node_modules/sql.js/package.json
win:
  target: nsis
  icon: build/icon-full.png
nsis:
  # Nombre fijo (sin version): asi el enlace .../releases/latest/download/Darasistema-Setup.exe
  # siempre baja la ultima version.
  artifactName: Darasistema-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
