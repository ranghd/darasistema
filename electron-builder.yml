  - dist-electron/**
  - package.json
  - node_modules/sql.js/dist/sql-wasm.wasm
  - node_modules/sql.js/dist/sql-wasm.js
  - node_modules/sql.js/package.json
win:
  target: nsis
  icon: build/icon-full.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
