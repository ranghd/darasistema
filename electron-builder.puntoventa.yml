appId: com.darasistema.puntoventa
productName: Gas Damian
publish:
  provider: github
  owner: ranghd
  repo: darasistema
  channel: puntoventa
  # Borrador: los clientes no lo ven hasta que release.js lo publica con los 4 programas completos.
  releaseType: draft
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
  - node_modules/sql.js/dist/sql-wasm.wasm
  - node_modules/sql.js/dist/sql-wasm.js
  - node_modules/sql.js/package.json
win:
  target: nsis
  icon: build/icon-puntoventa.png
nsis:
  # Nombre fijo (sin version): asi el enlace .../releases/latest/download/Gas-Damian-Setup.exe
  # siempre baja la ultima version.
  artifactName: Gas-Damian-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
